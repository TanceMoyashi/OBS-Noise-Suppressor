[package]
name = "obs-noise-suppressor"
version = "0.3.0"
edition = "2021"
publish = false
license = "GPL-2.0-or-later"
description = "OBS Noise Suppressor - OBS Studio native audio filter (Rust)"

[lib]
# cdylib 名 = OBS が読む DLL 名。ProgramData 配置ではフォルダ名と一致させる必要がある
# (OBS の find_modules_in_path が `<dir>/bin/64bit/<dir>.dll` を組み立てるため)。
name = "obs_noise_suppressor"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# OBS はオーディオスレッドで我々のコールバックを直接呼ぶ。
# パニックは FFI 境界で catch_unwind して握りつぶす設計なので unwind のままにする
# (abort にするとパニック 1 つで OBS ごと落ちる)。
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
# DSP コア（OBS 非依存）。VST3 版 (`clear_re/vst3`) と共有している。
# ONNX Runtime のバインディング・FFT・DLL ロードはこのクレート側にある。
dpdfnet = { path = "../dpdfnet" }

# Win32（自前 UI、ファイル列挙）
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

