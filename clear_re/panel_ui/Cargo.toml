[package]
name = "panel_ui"
version = "0.3.1"
edition = "2021"
publish = false
license = "GPL-2.0-or-later"
description = "DPDFNet の自前 Win32 パネル (GDI + DIB)。OBS 版と VST3 版で共有する"

[lib]
name = "panel_ui"
path = "src/lib.rs"

# ホスト非依存にするのが目的なので、外部クレートは増やさない。Win32 / GDI は
# `ffi` モジュールに生 FFI で宣言している。パラメータの意味（範囲・既定値・
# FeatureMode / ModelChoice / DeviceChoice）は DSP コアと単一の定義元を共有
# したいので dpdfnet だけに依存する。
[dependencies]
dpdfnet = { path = "../dpdfnet" }
